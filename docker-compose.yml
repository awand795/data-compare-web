version: '3.8'

services:
  # PostgreSQL Database
  postgres:
    image: postgres:16-alpine
    container_name: datasync-db
    restart: unless-stopped
    environment:
      POSTGRES_DB: datasync_studio
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${DB_PASSWORD:-Awanda213}
    ports:
      - "5433:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./backend/src/main/resources/schema.sql:/docker-entrypoint-initdb.d/01-schema.sql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s
    networks:
      - datasync-network

  # Spring Boot Backend
  backend:
    build:
      context: ./backend
    container_name: datasync-backend
    restart: unless-stopped
    environment:
      DB_HOST: postgres
      DB_PORT: 5432
      DB_NAME: datasync_studio
      DB_USER: postgres
      DB_PASSWORD: ${DB_PASSWORD:-Awanda213}
    ports:
      - "8081:8081"
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - datasync-network

  # React Frontend with Nginx
  frontend:
    build:
      context: ./frontend
      args:
        VITE_API_URL: ""
    container_name: datasync-frontend
    restart: unless-stopped
    ports:
      - "5173:80"
    depends_on:
      - backend
    networks:
      - datasync-network

volumes:
  postgres_data:
    driver: local

networks:
  datasync-network:
    driver: bridge
