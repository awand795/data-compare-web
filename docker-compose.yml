
services:
  # Spring Boot Backend (Connected to Internal Database)
  backend:
    build:
      context: ./backend
    container_name: darkosync-backend
    restart: unless-stopped
    environment:
      TZ: Asia/Jakarta
      DB_HOST: ***REMOVED***
      DB_PORT: 8832
      DB_NAME: data_setting_sync
      DB_USER: postgres
      DB_PASSWORD: ${INTERNAL_DB_PASSWORD}
    ports:
      - "5300:8081"
    volumes:
      - ./ssh-keys:/app/ssh-keys:ro
    networks:
      - darkosync-network
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
    stop_grace_period: 30m
    deploy:
      update_config:
        parallelism: 1
        delay: 10s
        order: start-first
      rollback_config:
        parallelism: 1
        order: start-first

  # React Frontend with Nginx
  frontend:
    build:
      context: ./frontend
      args:
        VITE_API_URL: ""
    container_name: darkosync-frontend
    restart: unless-stopped
    ports:
      - "5173:80"
    depends_on:
      - backend
    networks:
      - darkosync-network
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
    stop_grace_period: 1m
    deploy:
      update_config:
        parallelism: 1
        delay: 5s
        order: start-first
      rollback_config:
        parallelism: 1
        order: start-first

  dummy-db:
    image: postgres:15-alpine
    container_name: dummy-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: ubuntu
      POSTGRES_PASSWORD: password123
      POSTGRES_DB: sampledb
    networks:
      - darkosync-network

  dummy-ssh:
    image: lscr.io/linuxserver/openssh-server:latest
    container_name: dummy-ssh
    restart: unless-stopped
    environment:
      - PUID=1000
      - PGID=1000
      - TZ=Etc/UTC
      - PUBLIC_KEY=ssh-rsa  awand@DESKTOP-E9J35AP
      - USER_NAME=ubuntu
      - USER_PASSWORD=password123
      - PASSWORD_ACCESS=true
      - SUDO_ACCESS=false
    networks:
      - darkosync-network
    ports:
      - "2222:2222"

networks:
  darkosync-network:
    driver: bridge
