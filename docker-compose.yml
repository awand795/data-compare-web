
services:
  # Spring Boot Backend (Connected to Internal Database)
  backend:
    image: awandadarkotech/darkosync-backend:latest
    build:
      context: ./backend
    container_name: darkosync-backend
    restart: unless-stopped
    environment:
      - JAVA_OPTS=-Xmx1536m -Xms1536m -DMALLOC_ARENA_MAX=2
      - MALLOC_ARENA_MAX=2
      - TZ=Asia/Jakarta
      - DB_HOST=war.darkosuite.com
      - DB_PORT=8832
      - DB_NAME=data_setting_sync
      - DB_USER=postgres
      - DB_PASSWORD=${INTERNAL_DB_PASSWORD}
      - KAFKA_BOOTSTRAP_SERVERS=tasks.kafka:9092
      - DEBEZIUM_BASE_URL=http://tasks.debezium:8083
    ports:
      - target: 8081
        published: 5300
        protocol: tcp
        mode: ingress
    volumes:
      - ./ssh-keys:/app/ssh-keys:ro
    networks:
      - darkosync-network
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
    stop_grace_period: 30m
    deploy:
      update_config:
        parallelism: 1
        delay: 10s
        order: start-first
      rollback_config:
        parallelism: 1
        order: start-first
      resources:
        limits:
          memory: 2G

  # React Frontend with Nginx
  frontend:
    image: awandadarkotech/darkosync-frontend:latest
    build:
      context: ./frontend
      args:
        VITE_API_URL: ""
    container_name: darkosync-frontend
    restart: unless-stopped
    ports:
      - target: 80
        published: 5173
        protocol: tcp
        mode: ingress
      - target: 80
        published: 5175
        protocol: tcp
        mode: ingress

    networks:
      - darkosync-network
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
    stop_grace_period: 1m
    deploy:
      update_config:
        parallelism: 1
        delay: 5s
        order: start-first
      rollback_config:
        parallelism: 1
        order: start-first
      resources:
        limits:
          memory: 256M

  # Data Warehouse Stack
  zookeeper:
    image: quay.io/debezium/zookeeper:2.4
    container_name: darkosync-zookeeper
    environment:
      - KAFKA_HEAP_OPTS=-Xmx128m -Xms128m
      - MALLOC_ARENA_MAX=2
    deploy:
      resources:
        limits:
          memory: 256M
    volumes:
      - zookeeper_data:/zookeeper/data
      - zookeeper_txns:/zookeeper/txns
    networks:
      darkosync-network:
        aliases:
          - zookeeper

  kafka:
    image: quay.io/debezium/kafka:2.4
    extra_hosts:
      - "tasks.kafka:127.0.0.1"
      - "kafka:127.0.0.1"
    deploy:
      resources:
        limits:
          memory: 768M
      restart_policy:
        condition: any
        delay: 20s
        max_attempts: 10
        window: 180s
      update_config:
        parallelism: 1
        delay: 25s
        order: stop-first
        failure_action: continue
        monitor: 30s
    depends_on:
      - zookeeper
    healthcheck:
      test: ["CMD-SHELL", "bash -c 'cat < /dev/null > /dev/tcp/127.0.0.1/9092' || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 30s
    environment:
      - KAFKA_HEAP_OPTS=-Xmx384m -Xms256m
      - MALLOC_ARENA_MAX=2
      - ZOOKEEPER_CONNECT=zookeeper:2181
      - KAFKA_LISTENERS=PLAINTEXT://0.0.0.0:9092
      - KAFKA_ADVERTISED_LISTENERS=PLAINTEXT://tasks.kafka:9092
      - KAFKA_ZOOKEEPER_SESSION_TIMEOUT_MS=6000
      - KAFKA_ZOOKEEPER_CONNECTION_TIMEOUT_MS=6000
      - KAFKA_AUTO_CREATE_TOPICS_ENABLE=true
      - KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR=1
      - KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR=1
      - KAFKA_TRANSACTION_STATE_LOG_MIN_ISR=1
      - KAFKA_LOG_RETENTION_HOURS=24
      - KAFKA_LOG_RETENTION_BYTES=1073741824
    volumes:
      - kafka_data:/kafka/data
    networks:
      darkosync-network:
        aliases:
          - kafka

  debezium:
    image: awandadarkotech/debezium-clickhouse:latest
    build:
      context: ./debezium-custom
    container_name: darkosync-debezium
    extra_hosts:
      - "tasks.debezium:127.0.0.1"
      - "debezium:127.0.0.1"
    ports:
      - target: 8083
        published: 8083
        protocol: tcp
        mode: ingress
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://localhost:8083/connectors >/dev/null 2>&1"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 120s
    deploy:
      resources:
        limits:
          memory: 1024M
      restart_policy:
        condition: any
        delay: 20s
        max_attempts: 20
        window: 600s
    depends_on:
      - kafka
    environment:
      - KAFKA_HEAP_OPTS=-Xmx512m -Xms256m
      - MALLOC_ARENA_MAX=2
      - BOOTSTRAP_SERVERS=tasks.kafka:9092
      - GROUP_ID=1
      - CONFIG_STORAGE_TOPIC=my_connect_configs
      - OFFSET_STORAGE_TOPIC=my_connect_offsets
      - STATUS_STORAGE_TOPIC=my_connect_statuses
      - CONFIG_STORAGE_REPLICATION_FACTOR=1
      - OFFSET_STORAGE_REPLICATION_FACTOR=1
      - STATUS_STORAGE_REPLICATION_FACTOR=1
      - CONNECT_ADMIN_REQUEST_TIMEOUT_MS=60000
      - CONNECT_CONNECTIONS_MAX_IDLE_MS=600000
    networks:
      darkosync-network:
        aliases:
          - debezium

  clickhouse:
    image: clickhouse/clickhouse-server:latest
    container_name: darkosync-clickhouse
    ports:
      - target: 8123
        published: 8123
        protocol: tcp
        mode: ingress
      - target: 9000
        published: 9000
        protocol: tcp
        mode: ingress
    deploy:
      resources:
        limits:
          memory: 2048M
    environment:
      - CLICKHOUSE_DB=default
      - CLICKHOUSE_USER=default
      - CLICKHOUSE_PASSWORD=
    volumes:
      - clickhouse_data:/var/lib/clickhouse
      - ./clickhouse-config/users-override.xml:/etc/clickhouse-server/users.d/users-override.xml:ro
    networks:
      - darkosync-network

volumes:
  clickhouse_data:
  zookeeper_data:
  zookeeper_txns:
  kafka_data:

networks:
  darkosync-network:
    driver: overlay
    attachable: true
    driver_opts:
      com.docker.network.driver.mtu: "1350"
    ipam:
      config:
        - subnet: 192.168.199.0/24

