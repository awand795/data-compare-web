version: '3.8'

services:
  # Spring Boot Backend (Connected to Neon Database)
  backend:
    build:
      context: ./backend
    container_name: darkosync-backend
    restart: unless-stopped
    environment:
      DB_HOST: ***REMOVED***
      DB_PORT: 5432
      DB_NAME: neondb
      DB_USER: neondb_owner
      DB_PASSWORD: npg_lSm6g8kRZEoL
    ports:
      - "8081:8081"
    networks:
      - darkosync-network

  # React Frontend with Nginx
  frontend:
    build:
      context: ./frontend
      args:
        VITE_API_URL: ""
    container_name: darkosync-frontend
    restart: unless-stopped
    ports:
      - "5173:80"
    depends_on:
      - backend
    networks:
      - darkosync-network

networks:
  darkosync-network:
    driver: bridge
