
services:
  # Spring Boot Backend (Connected to Internal Database)
  backend:
    image: awandadarkotech/darkosync-backend:latest
    build:
      context: ./backend
    container_name: darkosync-backend
    restart: unless-stopped
    environment:
      - JAVA_OPTS=-Xmx384m -Xms256m -DMALLOC_ARENA_MAX=2
      - MALLOC_ARENA_MAX=2
      - TZ=Asia/Jakarta
      - DB_HOST=war.darkosuite.com
      - DB_PORT=8832
      - DB_NAME=data_setting_sync
      - DB_USER=postgres
      - DB_PASSWORD=${INTERNAL_DB_PASSWORD}
    ports:
      - target: 8081
        published: 5300
        protocol: tcp
        mode: ingress
    volumes:
      - ./ssh-keys:/app/ssh-keys:ro
    networks:
      - darkosync-network
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
    stop_grace_period: 30m
    deploy:
      update_config:
        parallelism: 1
        delay: 10s
        order: start-first
      rollback_config:
        parallelism: 1
        order: start-first
      resources:
        limits:
          memory: 768M

  # React Frontend with Nginx
  frontend:
    image: awandadarkotech/darkosync-frontend:latest
    build:
      context: ./frontend
      args:
        VITE_API_URL: "/"
    container_name: darkosync-frontend
    restart: unless-stopped
    ports:
      - target: 80
        published: 5173
        protocol: tcp
        mode: ingress
      - target: 80
        published: 5175
        protocol: tcp
        mode: ingress

    networks:
      - darkosync-network
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
    stop_grace_period: 1m
    deploy:
      update_config:
        parallelism: 1
        delay: 5s
        order: start-first
      rollback_config:
        parallelism: 1
        order: start-first
      resources:
        limits:
          memory: 256M

  # Data Warehouse Stack
  zookeeper:
    image: quay.io/debezium/zookeeper:2.4
    container_name: darkosync-zookeeper
    environment:
      - KAFKA_HEAP_OPTS=-Xmx256m -Xms256m
      - MALLOC_ARENA_MAX=2
    deploy:
      resources:
        limits:
          memory: 384M
    ports:
      - target: 2181
        published: 2181
        protocol: tcp
        mode: ingress
      - target: 2888
        published: 2888
        protocol: tcp
        mode: ingress
      - target: 3888
        published: 3888
        protocol: tcp
        mode: ingress
    volumes:
      - zookeeper_data:/zookeeper/data
      - zookeeper_txns:/zookeeper/txns
    networks:
      - darkosync-network

  kafka:
    image: quay.io/debezium/kafka:2.4
    container_name: darkosync-kafka
    deploy:
      endpoint_mode: dnsrr
      resources:
        limits:
          memory: 768M
    depends_on:
      - zookeeper
    environment:
      - KAFKA_HEAP_OPTS=-Xmx384m -Xms256m
      - MALLOC_ARENA_MAX=2
      - ZOOKEEPER_CONNECT=zookeeper:2181
      - KAFKA_ADVERTISED_LISTENERS=PLAINTEXT://kafka:9092
      - HOST_NAME=kafka
      - KAFKA_AUTO_CREATE_TOPICS_ENABLE=true
    volumes:
      - kafka_data:/kafka/data
    networks:
      - darkosync-network

  debezium:
    image: awandadarkotech/debezium-clickhouse:latest
    container_name: darkosync-debezium
    ports:
      - target: 8083
        published: 8083
        protocol: tcp
        mode: ingress
    deploy:
      resources:
        limits:
          memory: 768M
    depends_on:
      - kafka
    environment:
      - JAVA_OPTS=-Xmx384m -Xms256m
      - MALLOC_ARENA_MAX=2
      - BOOTSTRAP_SERVERS=kafka:9092
      - GROUP_ID=1
      - CONFIG_STORAGE_TOPIC=my_connect_configs
      - OFFSET_STORAGE_TOPIC=my_connect_offsets
      - STATUS_STORAGE_TOPIC=my_connect_statuses
    networks:
      - darkosync-network

  clickhouse:
    image: clickhouse/clickhouse-server:latest
    container_name: darkosync-clickhouse
    ports:
      - target: 8123
        published: 8123
        protocol: tcp
        mode: ingress
      - target: 9000
        published: 9000
        protocol: tcp
        mode: ingress
    deploy:
      resources:
        limits:
          memory: 1536M
    environment:
      - CLICKHOUSE_DB=default
      - CLICKHOUSE_USER=default
      - CLICKHOUSE_PASSWORD=
    volumes:
      - clickhouse_data:/var/lib/clickhouse
      - ./clickhouse-config/users-override.xml:/etc/clickhouse-server/users.d/users-override.xml:ro
    networks:
      - darkosync-network

volumes:
  clickhouse_data:
  zookeeper_data:
  zookeeper_txns:
  kafka_data:

networks:
  darkosync-network:
    driver: overlay
    attachable: true
    driver_opts:
      com.docker.network.driver.mtu: "1350"
    ipam:
      config:
        - subnet: 192.168.199.0/24

