
services:
  # Spring Boot Backend (Connected to Internal Database)
  backend:
    image: darkosync-backend-local:latest
    build:
      context: ./backend
    container_name: darkosync-backend
    restart: unless-stopped
    environment:
      TZ: Asia/Jakarta
      DB_HOST: war.darkosuite.com
      DB_PORT: 8832
      DB_NAME: data_setting_sync
      DB_USER: postgres
      DB_PASSWORD: ${INTERNAL_DB_PASSWORD}
    ports:
      - target: 8081
        published: 5300
        protocol: tcp
        mode: ingress
    volumes:
      - ./ssh-keys:/app/ssh-keys:ro
    networks:
      - darkosync-network
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
    stop_grace_period: 30m
    deploy:
      update_config:
        parallelism: 1
        delay: 10s
        order: start-first
      rollback_config:
        parallelism: 1
        order: start-first

  # React Frontend with Nginx
  frontend:
    image: darkosync-frontend-local:latest
    build:
      context: ./frontend
      args:
        VITE_API_URL: ""
    container_name: darkosync-frontend
    restart: unless-stopped
    ports:
      - target: 80
        published: 5173
        protocol: tcp
        mode: ingress

    networks:
      - darkosync-network
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
    stop_grace_period: 1m
    deploy:
      update_config:
        parallelism: 1
        delay: 5s
        order: start-first
      rollback_config:
        parallelism: 1
        order: start-first

  # Data Warehouse Stack
  zookeeper:
    image: quay.io/debezium/zookeeper:2.4
    container_name: darkosync-zookeeper
    ports:
      - target: 2181
        published: 2181
        protocol: tcp
        mode: ingress
      - target: 2888
        published: 2888
        protocol: tcp
        mode: ingress
      - target: 3888
        published: 3888
        protocol: tcp
        mode: ingress
    volumes:
      - zookeeper_data:/var/lib/zookeeper/data
      - zookeeper_log:/var/lib/zookeeper/log
    networks:
      - darkosync-network
    deploy:
      restart_policy:
        condition: on-failure

  kafka:
    image: quay.io/debezium/kafka:2.4
    container_name: darkosync-kafka
    ports:
      - target: 9092
        published: 9092
        protocol: tcp
        mode: ingress
    depends_on:
      - zookeeper
    environment:
      - ZOOKEEPER_CONNECT=zookeeper:2181
    volumes:
      - kafka_data:/var/lib/kafka/data
    networks:
      - darkosync-network
    deploy:
      restart_policy:
        condition: on-failure

  debezium:
    image: quay.io/debezium/connect:2.4
    container_name: darkosync-debezium
    ports:
      - target: 8083
        published: 8083
        protocol: tcp
        mode: ingress
    depends_on:
      - kafka
    environment:
      - BOOTSTRAP_SERVERS=kafka:9092
      - GROUP_ID=1
      - CONFIG_STORAGE_TOPIC=my_connect_configs
      - OFFSET_STORAGE_TOPIC=my_connect_offsets
      - STATUS_STORAGE_TOPIC=my_connect_statuses
    networks:
      - darkosync-network
    deploy:
      restart_policy:
        condition: on-failure

  clickhouse:
    image: clickhouse/clickhouse-server:latest
    container_name: darkosync-clickhouse
    ports:
      - target: 8123
        published: 8123
        protocol: tcp
        mode: ingress
      - target: 9000
        published: 9000
        protocol: tcp
        mode: ingress
    environment:
      - CLICKHOUSE_DB=default
      - CLICKHOUSE_USER=default
      - CLICKHOUSE_PASSWORD=${CLICKHOUSE_PASSWORD:-}
    volumes:
      - clickhouse_data:/var/lib/clickhouse
      - ./clickhouse-config/users-override.xml:/etc/clickhouse-server/users.d/users-override.xml:ro
    networks:
      - darkosync-network
    deploy:
      restart_policy:
        condition: on-failure

volumes:
  clickhouse_data:
  kafka_data:
  zookeeper_data:
  zookeeper_log:

networks:
  darkosync-network:
    name: darkosync-local-net
    driver: overlay
