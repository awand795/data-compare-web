server.port=8081
server.error.include-message=always

# Primary database configuration (uses env vars for Docker compatibility)
spring.datasource.url=jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:datasync_studio}
spring.datasource.username=${DB_USER:postgres}
spring.datasource.password=${DB_PASSWORD:Awanda213}
spring.datasource.driver-class-name=org.postgresql.Driver
spring.datasource.hikari.leak-detection-threshold=60000

# Initialize schema
spring.sql.init.mode=always

# Increase async request timeout to 1 hour (3600000 ms) for large streaming requests
spring.mvc.async.request-timeout=3600000

# Logging
logging.file.name=logs/datasync.log
logging.logback.rollingpolicy.max-file-size=50MB
logging.logback.rollingpolicy.max-history=5

# Level
logging.level.com.dbdiff=DEBUG
logging.level.com.zaxxer.hikari=DEBUG
logging.level.org.postgresql=INFO
