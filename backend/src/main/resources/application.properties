server.port=8081
server.error.include-message=always

# Primary database configuration (uses env vars for Neon/Render compatibility)
spring.datasource.url=jdbc:postgresql://${DB_HOST:***REMOVED***}:${DB_PORT:5432}/${DB_NAME:neondb}?sslmode=require
spring.datasource.username=${DB_USER:neondb_owner}
spring.datasource.password=${DB_PASSWORD:npg_lSm6g8kRZEoL}
spring.datasource.driver-class-name=org.postgresql.Driver
spring.datasource.hikari.leak-detection-threshold=60000
spring.datasource.hikari.maximum-pool-size=5
spring.datasource.hikari.minimum-idle=1
spring.datasource.hikari.connection-timeout=30000

# Initialize schema — never agar tidak blocking startup (Neon persistent, tabel sudah ada)
spring.sql.init.mode=never

# Allow app to start even if DB is temporarily unreachable
spring.datasource.hikari.initialization-fail-timeout=-1

# Increase async request timeout to 1 hour (3600000 ms) for large streaming requests
spring.mvc.async.request-timeout=3600000

# Logging
logging.file.name=logs/datasync.log
logging.logback.rollingpolicy.max-file-size=50MB
logging.logback.rollingpolicy.max-history=5

# Level
logging.level.com.dbdiff=DEBUG
logging.level.com.zaxxer.hikari=DEBUG
logging.level.org.postgresql=INFO
