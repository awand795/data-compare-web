server.port=8081
server.address=0.0.0.0
server.error.include-message=always

# Primary database configuration (uses env vars for Neon/Render compatibility)
spring.datasource.url=jdbc:postgresql://${DB_HOST:***REMOVED***}:${DB_PORT:5432}/${DB_NAME:neondb}?sslmode=require
spring.datasource.username=${DB_USER:neondb_owner}
spring.datasource.password=${DB_PASSWORD:npg_lSm6g8kRZEoL}
spring.datasource.driver-class-name=org.postgresql.Driver
spring.datasource.hikari.leak-detection-threshold=60000
spring.datasource.hikari.maximum-pool-size=5
spring.datasource.hikari.minimum-idle=1
spring.datasource.hikari.connection-timeout=30000
spring.datasource.hikari.max-lifetime=240000

# Initialize schema — never agar tidak blocking startup (Neon persistent, tabel sudah ada)
spring.sql.init.mode=never

# Allow app to start even if DB is temporarily unreachable
spring.datasource.hikari.initialization-fail-timeout=-1

# Increase async request timeout to 1 hour (3600000 ms) for large streaming requests
spring.mvc.async.request-timeout=3600000

# Logging
logging.file.name=logs/darkosync.log
logging.logback.rollingpolicy.max-file-size=10MB
logging.logback.rollingpolicy.max-history=3

# Level — use INFO in production to reduce memory usage from log buffers
logging.level.com.dbdiff=INFO
logging.level.com.zaxxer.hikari=WARN
logging.level.org.postgresql=WARN

# Limit multipart upload size to prevent OOM from large Excel uploads
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=10MB
