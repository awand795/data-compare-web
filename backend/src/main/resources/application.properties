server.port=${PORT:8081}
server.address=0.0.0.0
server.error.include-message=always

# ──────────────────────────────────────────────────────────────────────────────
# INTERNAL DATABASE (war.darkosuite.com) — Spring-managed HikariCP pool
# Hanya dipakai untuk metadata aplikasi (connections, templates, schedules, dll).
# Koneksi USER dikelola manual oleh ConnectionManagerService (bukan Spring).
# ──────────────────────────────────────────────────────────────────────────────
spring.datasource.url=jdbc:postgresql://${DB_HOST:war.darkosuite.com}:${DB_PORT:8832}/${DB_NAME:data_setting_sync}
spring.datasource.username=${DB_USER:postgres}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=org.postgresql.Driver
spring.datasource.hikari.pool-name=war-internal-pool
spring.datasource.hikari.maximum-pool-size=10
spring.datasource.hikari.minimum-idle=2
spring.datasource.hikari.idle-timeout=120000
spring.datasource.hikari.connection-timeout=30000
spring.datasource.hikari.max-lifetime=300000
spring.datasource.hikari.keepalive-time=60000
spring.datasource.hikari.leak-detection-threshold=120000
spring.datasource.hikari.data-source-properties.queryTimeout=120

# Initialize schema
spring.sql.init.mode=always

# Allow app to start even if DB is temporarily unreachable
spring.datasource.hikari.initialization-fail-timeout=-1

# ──────────────────────────────────────────────────────────────────────────────
# USER CONNECTION POOLS dikelola oleh ConnectionManagerService (programmatic).
# Konfigurasi di atas hanya untuk koneksi INTERNAL aplikasi.
# Konfigurasi user pool ada di ConnectionManagerService.java:
#   - maxPoolSize=10, minIdle=2
#   - connectionTimeout=60s, idleTimeout=120s, maxLifetime=5min, keepaliveTime=60s
# ──────────────────────────────────────────────────────────────────────────────

# Increase async request timeout to 1 hour (3600000 ms) for large streaming requests
spring.mvc.async.request-timeout=3600000

# Logging
logging.file.name=logs/darkosync.log
logging.logback.rollingpolicy.max-file-size=10MB
logging.logback.rollingpolicy.max-history=3

# Level — use INFO in production to reduce memory usage from log buffers
logging.level.com.dbdiff=INFO
logging.level.com.zaxxer.hikari=WARN
logging.level.org.postgresql=WARN

# Limit multipart upload size to prevent OOM from large Excel uploads
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=10MB

# Enable Project Loom Virtual Threads (Requires Java 21)
# NOTE: Virtual threads + HikariCP can cause carrier thread pinning when
# connections are contended. The internal pool (neon-internal-pool) has small
# size so this is low-risk. User pools are accessed from async thread pool
# (maxPoolSize=4) to avoid pinning Tomcat's virtual threads.
spring.threads.virtual.enabled=true
spring.datasource.hikari.allow-pool-suspension=false
spring.task.execution.pool.core-size=4
spring.task.execution.pool.max-size=8
spring.task.execution.pool.queue-capacity=100
spring.task.scheduling.pool.size=10

# Tomcat Socket optimizations for large streaming
server.tomcat.socket.write-buffer-size=65536
server.tomcat.socket.receive-buffer-size=65536
server.tomcat.socket.performance-connection-time=0
server.tomcat.socket.performance-latency=0
server.tomcat.socket.performance-bandwidth=1

# Graceful Shutdown
server.shutdown=graceful
spring.lifecycle.timeout-per-shutdown-phase=30m
